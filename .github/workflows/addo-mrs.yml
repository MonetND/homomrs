name: Build Adobe MRS

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 03:00 运行
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest clash.yaml
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/ignaciocastro/a-dove-is-dumb/main/clash.yaml" \
            -o clash.yaml

      - name: Get latest Mihomo version
        id: mihomo
        shell: bash
        run: |
          VERSION="$(
            curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest |
            jq -r '.tag_name'
          )"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to get Mihomo version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest Mihomo: $VERSION"

      - name: Download Mihomo
        shell: bash
        run: |
          VERSION="${{ steps.mihomo.outputs.version }}"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-v3-${VERSION}.gz"

          echo "Downloading:"
          echo "$URL"

          curl -fL "$URL" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo

          ./mihomo -v

      - name: Convert YAML to MRS
        run: |
          ./mihomo convert-ruleset domain yaml clash.yaml adobe.mrs

      - name: Check result
        run: |
          ls -lh clash.yaml adobe.mrs
          file adobe.mrs

      - name: Commit updated MRS
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add adobe.mrs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update adobe.mrs"
          git push
